<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    The app icon IS the app's home screen: six voice-coloured columns of blocks in a
    sunken white well, wearing the same Windows 98 language as everything else — grey
    #c0c0c0 chrome, square corners, depth drawn with hairlines rather than shadow.
    The well's bevel is the two-line "field" pair from style.css (the field-in token; a
    double hyphen can't be written inside XML comments): #808080 on the top and left,
    #ffffff on the bottom and right, and nothing else.
    The grey bleeds to the edge on purpose: the icon is declared maskable, so a launcher
    may crop it to a circle or a squircle. Everything that carries meaning lives inside
    the centre 288px — within the 80% safe zone — and only flat grey is ever cut.
    Colours are VOICE_COLORS from src/model/lines.ts, in voice order; the block patterns
    are Euclidean spreads (3-, 4- and 2-of-8), which is what the columns paint in use.
  -->
  <rect width="512" height="512" fill="#c0c0c0"/>

  <!-- The sunken well, in two rects: the shadow square, then the white square shifted
       10px down-right off it. The shift is the whole bevel — grey shows along the top and
       left, white spills past the field's bottom and right, and the overlap is the field
       itself (114..404, which is what the columns are laid out inside). -->
  <rect x="104" y="104" width="300" height="300" fill="#808080"/>
  <rect x="114" y="114" width="300" height="300" fill="#ffffff"/>

  <!-- Six columns of eight blocks. Empty blocks keep the field white with a hairline;
       a filled block is that voice's colour, so the icon reads as a played track. -->
  <g stroke="#dfdfdf" stroke-width="4">
    <!-- voice 1 -->
    <rect x="124" y="124" width="40" height="28.5" fill="#a80000" stroke="none"/>
    <rect x="124" y="158.5" width="40" height="28.5" fill="#ffffff"/>
    <rect x="124" y="193" width="40" height="28.5" fill="#ffffff"/>
    <rect x="124" y="227.5" width="40" height="28.5" fill="#a80000" stroke="none"/>
    <rect x="124" y="262" width="40" height="28.5" fill="#ffffff"/>
    <rect x="124" y="296.5" width="40" height="28.5" fill="#ffffff"/>
    <rect x="124" y="331" width="40" height="28.5" fill="#a80000" stroke="none"/>
    <rect x="124" y="365.5" width="40" height="28.5" fill="#ffffff"/>
    <!-- voice 2 -->
    <rect x="170" y="124" width="40" height="28.5" fill="#a85400" stroke="none"/>
    <rect x="170" y="158.5" width="40" height="28.5" fill="#ffffff"/>
    <rect x="170" y="193" width="40" height="28.5" fill="#a85400" stroke="none"/>
    <rect x="170" y="227.5" width="40" height="28.5" fill="#ffffff"/>
    <rect x="170" y="262" width="40" height="28.5" fill="#a85400" stroke="none"/>
    <rect x="170" y="296.5" width="40" height="28.5" fill="#ffffff"/>
    <rect x="170" y="331" width="40" height="28.5" fill="#a85400" stroke="none"/>
    <rect x="170" y="365.5" width="40" height="28.5" fill="#ffffff"/>
    <!-- voice 3 -->
    <rect x="216" y="124" width="40" height="28.5" fill="#ffffff"/>
    <rect x="216" y="158.5" width="40" height="28.5" fill="#a8a800" stroke="none"/>
    <rect x="216" y="193" width="40" height="28.5" fill="#ffffff"/>
    <rect x="216" y="227.5" width="40" height="28.5" fill="#a8a800" stroke="none"/>
    <rect x="216" y="262" width="40" height="28.5" fill="#ffffff"/>
    <rect x="216" y="296.5" width="40" height="28.5" fill="#a8a800" stroke="none"/>
    <rect x="216" y="331" width="40" height="28.5" fill="#ffffff"/>
    <rect x="216" y="365.5" width="40" height="28.5" fill="#a8a800" stroke="none"/>
    <!-- voice 4 -->
    <rect x="262" y="124" width="40" height="28.5" fill="#00a800" stroke="none"/>
    <rect x="262" y="158.5" width="40" height="28.5" fill="#ffffff"/>
    <rect x="262" y="193" width="40" height="28.5" fill="#ffffff"/>
    <rect x="262" y="227.5" width="40" height="28.5" fill="#00a800" stroke="none"/>
    <rect x="262" y="262" width="40" height="28.5" fill="#ffffff"/>
    <rect x="262" y="296.5" width="40" height="28.5" fill="#00a800" stroke="none"/>
    <rect x="262" y="331" width="40" height="28.5" fill="#ffffff"/>
    <rect x="262" y="365.5" width="40" height="28.5" fill="#ffffff"/>
    <!-- voice 5 -->
    <rect x="308" y="124" width="40" height="28.5" fill="#0000a8" stroke="none"/>
    <rect x="308" y="158.5" width="40" height="28.5" fill="#ffffff"/>
    <rect x="308" y="193" width="40" height="28.5" fill="#ffffff"/>
    <rect x="308" y="227.5" width="40" height="28.5" fill="#ffffff"/>
    <rect x="308" y="262" width="40" height="28.5" fill="#0000a8" stroke="none"/>
    <rect x="308" y="296.5" width="40" height="28.5" fill="#ffffff"/>
    <rect x="308" y="331" width="40" height="28.5" fill="#0000a8" stroke="none"/>
    <rect x="308" y="365.5" width="40" height="28.5" fill="#ffffff"/>
    <!-- voice 6 -->
    <rect x="354" y="124" width="40" height="28.5" fill="#a800a8" stroke="none"/>
    <rect x="354" y="158.5" width="40" height="28.5" fill="#a800a8" stroke="none"/>
    <rect x="354" y="193" width="40" height="28.5" fill="#ffffff"/>
    <rect x="354" y="227.5" width="40" height="28.5" fill="#ffffff"/>
    <rect x="354" y="262" width="40" height="28.5" fill="#a800a8" stroke="none"/>
    <rect x="354" y="296.5" width="40" height="28.5" fill="#ffffff"/>
    <rect x="354" y="331" width="40" height="28.5" fill="#a800a8" stroke="none"/>
    <rect x="354" y="365.5" width="40" height="28.5" fill="#ffffff"/>
  </g>
</svg>
